<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Example business reserve location plan</title>
  <desc id="desc">An example distribution of Owner A, Owner B, and Keyholder C materials showing that no single location or owner can spend alone and that recovery remains possible.</desc>
  <defs>
    <linearGradient id="headerBlue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dff0ff"/>
      <stop offset="1" stop-color="#73bfff"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f39c12"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title-bar { fill: url(#headerBlue); }
      .title { font-family: Inter, Arial, sans-serif; font-size: 42px; font-weight: 850; fill: #050505; }
      .card { fill: #ffffff; stroke: #171717; stroke-width: 2.5; rx: 8; filter: url(#shadow); }
      .card-blue { fill: #eef7ff; }
      .card-orange { fill: #fff4e4; stroke: #f39c12; stroke-width: 3; }
      .card-green { fill: #effaf2; }
      .card-red { fill: #fff0ee; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 850; fill: #050505; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 650; fill: #252525; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 560; fill: #151515; }
      .tiny { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 650; fill: #333333; }
      .line { fill: none; stroke: #f39c12; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #242424; stroke-width: 2; stroke-linecap: round; }
      .device { fill: #ffffff; stroke: #111111; stroke-width: 2.3; rx: 5; }
      .backup { fill: #fff9ef; stroke: #f39c12; stroke-width: 2; rx: 5; }
      .descriptor { fill: #f3f3f3; stroke: #111111; stroke-width: 2; rx: 5; }
      .vault { fill: #f39c12; stroke: #111111; stroke-width: 3; rx: 10; }
      .vault-door { fill: #ffffff; stroke: #111111; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="760"/>
  <rect class="title-bar" x="32" y="32" width="1056" height="86"/>
  <text class="title" x="64" y="88">Example Location Plan</text>

  <rect class="card card-orange" x="395" y="148" width="330" height="176" rx="8"/>
  <rect class="vault" x="506" y="174" width="108" height="78" rx="10"/>
  <circle class="vault-door" cx="560" cy="213" r="24"/>
  <circle cx="560" cy="213" r="6" fill="#f39c12" stroke="#111111" stroke-width="2"/>
  <text class="label" x="560" y="284" text-anchor="middle">2-of-3 Reserve Wallet</text>
  <text class="sub" x="560" y="309" text-anchor="middle">Any two signers can spend</text>

  <rect class="card card-blue" x="64" y="154" width="286" height="200" rx="8"/>
  <text class="label" x="92" y="194">Owner A Location</text>
  <rect class="device" x="92" y="218" width="116" height="48" rx="5"/>
  <text class="body" x="113" y="248">Signer A</text>
  <rect class="backup" x="92" y="282" width="220" height="38" rx="5"/>
  <text class="body" x="110" y="306">Seed A backup, coded label</text>
  <rect class="descriptor" x="218" y="218" width="94" height="48" rx="5"/>
  <text class="tiny" x="265" y="239" text-anchor="middle">Descriptor</text>
  <text class="tiny" x="265" y="255" text-anchor="middle">+ recovery info</text>

  <rect class="card card-blue" x="770" y="154" width="286" height="200" rx="8"/>
  <text class="label" x="798" y="194">Owner B Location</text>
  <rect class="device" x="798" y="218" width="116" height="48" rx="5"/>
  <text class="body" x="819" y="248">Signer B</text>
  <rect class="backup" x="798" y="282" width="220" height="38" rx="5"/>
  <text class="body" x="816" y="306">Seed B backup, coded label</text>
  <rect class="descriptor" x="924" y="218" width="94" height="48" rx="5"/>
  <text class="tiny" x="971" y="239" text-anchor="middle">Descriptor</text>
  <text class="tiny" x="971" y="255" text-anchor="middle">+ recovery info</text>

  <rect class="card card-green" x="385" y="410" width="350" height="198" rx="8"/>
  <text class="label" x="425" y="450">Keyholder C Location</text>
  <rect class="device" x="426" y="476" width="120" height="50" rx="5"/>
  <text class="body" x="449" y="507">Signer C</text>
  <rect class="backup" x="566" y="476" width="120" height="50" rx="5"/>
  <text class="body" x="587" y="499">Seed C</text>
  <text class="tiny" x="587" y="516">coded label</text>
  <rect class="descriptor" x="426" y="544" width="260" height="44" rx="5"/>
  <text class="tiny" x="556" y="563" text-anchor="middle">Descriptor</text>
  <text class="tiny" x="556" y="579" text-anchor="middle">+ release instructions</text>

  <path class="line" d="M350 245 L389 245"/>
  <path class="line" d="M770 245 L731 245"/>
  <path class="line" d="M560 410 L560 330"/>
  <rect class="card card-red" x="250" y="648" width="620" height="82" rx="8"/>
  <text class="label" x="560" y="681" text-anchor="middle">Emergency Rule</text>
  <text class="body" x="560" y="708" text-anchor="middle">Signer C is released only through the documented recovery process.</text>
</svg>
