<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1180" role="img" aria-labelledby="title desc">
  <title id="title">Vertical business process map for recovery using Key C after loss of signer A</title>
  <desc id="desc">A vertical swimlane process map with actor groups at the top and recovery steps flowing downward after signer A is lost.</desc>
  <defs>
    <linearGradient id="headerBlue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dff0ff"/>
      <stop offset="1" stop-color="#73bfff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa9ff"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title-bar { fill: url(#headerBlue); }
      .title { font-family: Inter, Arial, sans-serif; font-size: 40px; font-weight: 850; fill: #050505; }
      .lane-head { fill: #dceeff; stroke: #c7def5; stroke-width: 1.5; }
      .lane-line { stroke: #e0e0e0; stroke-width: 2; }
      .lane-text { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #050505; }
      .lane-sub { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 650; fill: #2c2c2c; }
      .step { fill: #dbeeff; stroke: #b6d9ff; stroke-width: 2; rx: 5; }
      .decision { fill: #0f66d8; stroke: #0f66d8; stroke-width: 2; }
      .circle { fill: #5aa9ff; }
      .step-text { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 650; fill: #050505; }
      .decision-text { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 850; fill: #ffffff; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 650; fill: #202020; }
      .flow { fill: none; stroke: #5aa9ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-light { fill: none; stroke: #5aa9ff; stroke-width: 2.2; marker-end: url(#arrow); }
      .branch-label { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #202020; }
      .badge { fill: #0f66d8; }
      .badge-text { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 850; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="1180"/>
  <rect class="title-bar" x="32" y="32" width="1056" height="86"/>
  <text class="title" x="62" y="88">Business Process Map: Recovery With Key C</text>

  <rect class="lane-head" x="60" y="150" width="200" height="82"/>
  <rect class="lane-head" x="260" y="150" width="200" height="82"/>
  <rect class="lane-head" x="460" y="150" width="200" height="82"/>
  <rect class="lane-head" x="660" y="150" width="200" height="82"/>
  <rect class="lane-head" x="860" y="150" width="200" height="82"/>
  <text class="lane-text" x="126" y="188">Owner A</text>
  <text class="lane-text" x="326" y="188">Owner B</text>
  <text class="lane-text" x="518" y="188">Keyholder C</text>
  <text class="lane-text" x="716" y="188">Coordinator</text>
  <text class="lane-sub" x="716" y="207">Sparrow / node</text>
  <text class="lane-text" x="923" y="188">Company</text>
  <text class="lane-sub" x="925" y="207">records</text>

  <line class="lane-line" x1="60" y1="232" x2="60" y2="1128"/>
  <line class="lane-line" x1="260" y1="232" x2="260" y2="1128"/>
  <line class="lane-line" x1="460" y1="232" x2="460" y2="1128"/>
  <line class="lane-line" x1="660" y1="232" x2="660" y2="1128"/>
  <line class="lane-line" x1="860" y1="232" x2="860" y2="1128"/>
  <line class="lane-line" x1="1060" y1="232" x2="1060" y2="1128"/>

  <circle class="circle" cx="160" cy="285" r="27"/>
  <text class="small" x="149" y="290">Start</text>

  <rect class="step" x="96" y="340" width="128" height="58"/>
  <circle class="badge" cx="110" cy="354" r="10"/>
  <text class="badge-text" x="107" y="358">1</text>
  <text class="step-text" x="121" y="364">Report signer</text>
  <text class="step-text" x="137" y="380">A loss</text>

  <rect class="step" x="292" y="448" width="136" height="58"/>
  <circle class="badge" cx="306" cy="462" r="10"/>
  <text class="badge-text" x="303" y="466">2</text>
  <text class="step-text" x="320" y="472">Check trigger</text>
  <text class="step-text" x="308" y="488">and notify parties</text>

  <path class="decision" d="M360 570 L420 618 L360 666 L300 618 Z"/>
  <text class="decision-text" x="331" y="615">Valid trigger?</text>
  <text class="branch-label" x="378" y="704">yes</text>
  <text class="branch-label" x="430" y="604">no</text>

  <rect class="step" x="496" y="704" width="128" height="58"/>
  <circle class="badge" cx="510" cy="718" r="10"/>
  <text class="badge-text" x="507" y="722">3</text>
  <text class="step-text" x="529" y="728">Release or</text>
  <text class="step-text" x="519" y="744">use signer C</text>

  <rect class="step" x="696" y="812" width="128" height="58"/>
  <circle class="badge" cx="710" cy="826" r="10"/>
  <text class="badge-text" x="707" y="830">4</text>
  <text class="step-text" x="723" y="836">Create PSBT</text>
  <text class="step-text" x="713" y="852">to new wallet</text>

  <rect class="step" x="292" y="920" width="136" height="58"/>
  <circle class="badge" cx="306" cy="934" r="10"/>
  <text class="badge-text" x="303" y="938">5</text>
  <text class="step-text" x="325" y="944">Sign PSBT</text>
  <text class="step-text" x="315" y="960">with signer B</text>

  <rect class="step" x="496" y="920" width="128" height="58"/>
  <circle class="badge" cx="510" cy="934" r="10"/>
  <text class="badge-text" x="507" y="938">6</text>
  <text class="step-text" x="525" y="944">Sign PSBT</text>
  <text class="step-text" x="515" y="960">with signer C</text>

  <rect class="step" x="696" y="920" width="128" height="58"/>
  <circle class="badge" cx="710" cy="934" r="10"/>
  <text class="badge-text" x="707" y="938">7</text>
  <text class="step-text" x="726" y="944">Broadcast</text>
  <text class="step-text" x="728" y="960">via node</text>

  <rect class="step" x="884" y="992" width="152" height="58"/>
  <circle class="badge" cx="898" cy="1006" r="10"/>
  <text class="badge-text" x="895" y="1010">8</text>
  <text class="step-text" x="914" y="1016">Retire old wallet,</text>
  <text class="step-text" x="912" y="1032">record new policy</text>

  <rect class="step" x="884" y="704" width="152" height="58"/>
  <circle class="badge" cx="898" cy="718" r="10"/>
  <text class="badge-text" x="895" y="722">9</text>
  <text class="step-text" x="918" y="728">Stop and</text>
  <text class="step-text" x="905" y="744">document denial</text>

  <circle class="circle" cx="960" cy="1120" r="27"/>
  <text class="small" x="951" y="1125">End</text>

  <circle class="circle" cx="960" cy="865" r="27"/>
  <text class="small" x="951" y="870">End</text>

  <path class="flow" d="M160 312 L160 328"/>
  <path class="flow" d="M160 398 L160 412 L360 412 L360 442"/>
  <path class="flow" d="M360 506 L360 558"/>

  <path class="flow-light" d="M420 618 L960 618 L960 692"/>
  <path class="flow" d="M960 762 L960 826"/>

  <path class="flow" d="M360 666 L360 672 L560 672 L560 698"/>
  <path class="flow" d="M560 762 L560 778 L760 778 L760 806"/>
  <path class="flow" d="M696 841 L360 841 L360 914"/>
  <path class="flow" d="M428 949 L484 949"/>
  <path class="flow" d="M624 949 L684 949"/>
  <path class="flow" d="M824 949 L960 949 L960 980"/>
  <path class="flow" d="M960 1050 L960 1081"/>
</svg>
