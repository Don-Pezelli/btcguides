<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Business seed storage reserve schematic</title>
  <desc id="desc">A shop is separated from a long-term Bitcoin reserve vault controlled by two business owners with multisig seed backups.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f2f2f"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1100" height="620" rx="28" fill="#fffaf4"/>
  <rect x="28" y="28" width="1044" height="564" rx="22" fill="#ffffff"/>

  <text x="550" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#121212">Small Business Bitcoin Reserve</text>
  <g filter="url(#softShadow)">
    <rect x="85" y="180" width="300" height="250" rx="18" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <path d="M118 260 L235 190 L352 260 Z" fill="#f39c12" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
  <rect x="135" y="260" width="200" height="144" fill="#f8f8f8" stroke="#121212" stroke-width="3"/>
  <rect x="165" y="310" width="58" height="94" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <rect x="253" y="304" width="58" height="48" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <line x1="282" y1="304" x2="282" y2="352" stroke="#121212" stroke-width="3"/>
  <path d="M145 270 H325" stroke="#121212" stroke-width="3"/>
  <rect x="155" y="218" width="160" height="42" rx="8" fill="#121212"/>
  <text x="235" y="246" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">SHOP</text>
  <circle cx="197" cy="358" r="6" fill="#f39c12" stroke="#121212" stroke-width="2"/>
  <text x="235" y="466" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#121212">Business operations</text>
  <text x="235" y="495" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#555555">sales, invoices, staff devices</text>

  <line x1="515" y1="158" x2="515" y2="505" stroke="#b8b8b8" stroke-width="4" stroke-dasharray="12 12"/>
  <text x="515" y="535" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6a6a6a">security boundary</text>

  <g filter="url(#softShadow)">
    <rect x="632" y="180" width="300" height="250" rx="18" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <rect x="695" y="224" width="174" height="158" rx="18" fill="#e7eef2" stroke="#121212" stroke-width="4"/>
  <circle cx="782" cy="303" r="56" fill="#ffffff" stroke="#121212" stroke-width="5"/>
  <circle cx="782" cy="303" r="34" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <text x="782" y="317" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#121212">₿</text>
  <circle cx="782" cy="246" r="8" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <circle cx="733" cy="332" r="8" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <circle cx="831" cy="332" r="8" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <text x="782" y="458" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#121212">Long-term on-chain reserve</text>
  <text x="782" y="487" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#555555">rare withdrawals, owner governance</text>

  <g>
    <rect x="942" y="250" width="110" height="124" rx="16" fill="#ffffff" stroke="#121212" stroke-width="3"/>
    <text x="997" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#121212">2-of-3</text>
    <text x="997" y="308" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#555555">multisig</text>
    <g transform="translate(960 331)">
      <circle cx="7" cy="7" r="6" fill="#f39c12" stroke="#121212" stroke-width="3"/>
      <path d="M13 7 H34 M27 7 V13 M33 7 V12" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(960 352)">
      <circle cx="7" cy="7" r="6" fill="#f39c12" stroke="#121212" stroke-width="3"/>
      <path d="M13 7 H34 M27 7 V13 M33 7 V12" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(1000 341)">
      <circle cx="7" cy="7" r="6" fill="#ffffff" stroke="#121212" stroke-width="3"/>
      <path d="M13 7 H34 M27 7 V13 M33 7 V12" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
