<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Recovery key workflow flowchart</title>
  <desc id="desc">A flowchart for deciding how the third key recovery process should work for a business Bitcoin reserve.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f2f2f"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="28" fill="#fffaf4"/>
  <rect x="34" y="34" width="1132" height="752" rx="22" fill="#ffffff"/>
  <text x="600" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#121212">Third Key Recovery Workflow</text>

  <g filter="url(#softShadow)">
    <rect x="390" y="120" width="420" height="86" rx="16" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <text x="600" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#121212">Define the recovery event</text>
  <text x="600" y="181" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">death, incapacity, disappearance, legal removal, signer loss</text>

  <path d="M600 206 V248" stroke="#2f2f2f" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="390" y="250" width="420" height="86" rx="16" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <text x="600" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#121212">Choose who participates</text>
  <text x="600" y="311" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">private trusted person, institution, or multi-party process</text>

  <path d="M390 293 H255 V374" stroke="#2f2f2f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M810 293 H945 V374" stroke="#2f2f2f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="85" y="380" width="340" height="176" rx="16" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <text x="255" y="416" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#121212">Private trusted person</text>
  <text x="255" y="449" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">What will they know?</text>
  <text x="255" y="475" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">What will they hold?</text>
  <text x="255" y="501" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">Who may request release?</text>
  <text x="255" y="527" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">How do heirs prove authority?</text>

  <g filter="url(#softShadow)">
    <rect x="775" y="380" width="340" height="176" rx="16" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <text x="945" y="416" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#121212">Institution or several parties</text>
  <text x="945" y="449" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">What contract binds them?</text>
  <text x="945" y="475" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">What evidence triggers release?</text>
  <text x="945" y="501" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">Who can block or dispute?</text>
  <text x="945" y="527" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">What happens if they fail?</text>

  <path d="M255 556 V618 H470" stroke="#2f2f2f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M945 556 V618 H730" stroke="#2f2f2f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="390" y="585" width="420" height="116" rx="16" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <text x="600" y="620" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#121212">Write the release protocol</text>
  <text x="600" y="649" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">identity checks, documents, waiting periods, notifications</text>
  <text x="600" y="674" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">who records the event and where the record is stored</text>

  <path d="M600 701 V737" stroke="#2f2f2f" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="390" y="735" width="420" height="52" rx="16" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  </g>
  <text x="600" y="769" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#121212">Test with a small recovery rehearsal</text>
</svg>
