<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Business process map for spending from the reserve</title>
  <desc id="desc">A swimlane process map showing how Owner A, Owner B, the watch-only coordinator, and company records handle a reserve withdrawal.</desc>
  <defs>
    <linearGradient id="headerBlue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dff0ff"/>
      <stop offset="1" stop-color="#73bfff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa9ff"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title-bar { fill: url(#headerBlue); }
      .title { font-family: Inter, Arial, sans-serif; font-size: 44px; font-weight: 850; fill: #050505; }
      .lane-label { fill: #dceeff; }
      .lane-line { stroke: #d7d7d7; stroke-width: 2; }
      .lane-text { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 750; fill: #050505; }
      .step { fill: #dbeeff; stroke: #b6d9ff; stroke-width: 2; rx: 5; }
      .decision { fill: #0f66d8; stroke: #0f66d8; stroke-width: 2; }
      .circle { fill: #5aa9ff; }
      .step-text { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 650; fill: #050505; }
      .decision-text { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 650; fill: #202020; }
      .flow { fill: none; stroke: #5aa9ff; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-light { fill: none; stroke: #5aa9ff; stroke-width: 2.2; marker-end: url(#arrow); }
      .badge { fill: #0f66d8; }
      .badge-text { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 850; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="680"/>
  <rect class="title-bar" x="32" y="32" width="1056" height="86"/>
  <text class="title" x="62" y="88">Business Process Map: Spending From Reserve</text>

  <rect class="lane-label" x="32" y="146" width="150" height="112"/>
  <rect class="lane-label" x="32" y="258" width="150" height="112"/>
  <rect class="lane-label" x="32" y="370" width="150" height="112"/>
  <rect class="lane-label" x="32" y="482" width="150" height="112"/>
  <line class="lane-line" x1="32" y1="258" x2="1088" y2="258"/>
  <line class="lane-line" x1="32" y1="370" x2="1088" y2="370"/>
  <line class="lane-line" x1="32" y1="482" x2="1088" y2="482"/>
  <line class="lane-line" x1="32" y1="594" x2="1088" y2="594"/>
  <text class="lane-text" x="76" y="207">Owner A</text>
  <text class="lane-text" x="76" y="319">Owner B</text>
  <text class="lane-text" x="58" y="431">Coordinator</text>
  <text class="small" x="61" y="449">Sparrow / node</text>
  <text class="lane-text" x="58" y="543">Company</text>
  <text class="small" x="61" y="561">records</text>

  <circle class="circle" cx="235" cy="202" r="27"/>
  <text class="small" x="224" y="207">Start</text>

  <rect class="step" x="292" y="174" width="120" height="56"/>
  <circle class="badge" cx="306" cy="188" r="10"/>
  <text class="badge-text" x="303" y="192">1</text>
  <text class="step-text" x="315" y="198">Draft spend</text>
  <text class="step-text" x="312" y="214">request</text>

  <rect class="step" x="490" y="286" width="130" height="56"/>
  <circle class="badge" cx="504" cy="300" r="10"/>
  <text class="badge-text" x="501" y="304">2</text>
  <text class="step-text" x="517" y="310">Review purpose,</text>
  <text class="step-text" x="520" y="326">amount, fee</text>

  <path class="decision" d="M700 274 L750 314 L700 354 L650 314 Z"/>
  <text class="decision-text" x="677" y="311">Approved?</text>
  <text class="small" x="754" y="302">yes</text>
  <text class="small" x="696" y="374">no</text>

  <rect class="step" x="790" y="398" width="128" height="56"/>
  <circle class="badge" cx="804" cy="412" r="10"/>
  <text class="badge-text" x="801" y="416">3</text>
  <text class="step-text" x="816" y="422">Create PSBT</text>
  <text class="step-text" x="807" y="438">watch-only wallet</text>

  <rect class="step" x="500" y="508" width="132" height="56"/>
  <text class="step-text" x="532" y="532">Cancel and</text>
  <text class="step-text" x="526" y="548">record reason</text>
  <circle class="circle" cx="710" cy="536" r="27"/>
  <text class="small" x="701" y="541">End</text>
  <rect class="step" x="790" y="174" width="128" height="56"/>
  <circle class="badge" cx="804" cy="188" r="10"/>
  <text class="badge-text" x="801" y="192">4</text>
  <text class="step-text" x="821" y="198">Sign PSBT</text>
  <text class="step-text" x="810" y="214">with signer A</text>

  <rect class="step" x="950" y="286" width="128" height="56"/>
  <circle class="badge" cx="964" cy="300" r="10"/>
  <text class="badge-text" x="961" y="304">5</text>
  <text class="step-text" x="980" y="310">Sign PSBT</text>
  <text class="step-text" x="970" y="326">with signer B</text>
  <rect class="step" x="950" y="398" width="128" height="56"/>
  <circle class="badge" cx="964" cy="412" r="10"/>
  <text class="badge-text" x="961" y="416">6</text>
  <text class="step-text" x="979" y="422">Broadcast</text>
  <text class="step-text" x="981" y="438">via node</text>

  <rect class="step" x="946" y="508" width="136" height="56"/>
  <circle class="badge" cx="960" cy="522" r="10"/>
  <text class="badge-text" x="957" y="526">7</text>
  <text class="step-text" x="970" y="532">Attach invoice,</text>
  <text class="step-text" x="966" y="548">txid, approvals</text>

  <circle class="circle" cx="1014" cy="625" r="27"/>
  <text class="small" x="1005" y="630">End</text>

  <path class="flow" d="M262 202 L280 202"/>
  <path class="flow" d="M412 202 L452 202 L452 314 L478 314"/>
  <path class="flow" d="M620 314 L638 314"/>
  <path class="flow" d="M750 314 L854 314 L854 386"/>
  <path class="flow-light" d="M700 354 L566 354 L566 496"/>
  <path class="flow" d="M644 536 L671 536"/>
  <path class="flow" d="M854 398 L854 242"/>
  <path class="flow" d="M918 202 L1014 202 L1014 274"/>
  <path class="flow" d="M1014 342 L1014 386"/>
  <path class="flow" d="M1014 454 L1014 496"/>
  <path class="flow" d="M1014 564 L1014 586"/>
</svg>
