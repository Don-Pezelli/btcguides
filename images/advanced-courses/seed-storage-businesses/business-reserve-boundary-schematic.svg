<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Business reserve boundary schematic</title>
  <desc id="desc">Four Bitcoin storage categories: Owner A personal wallet, Owner B personal wallet, operating funds, and the shared on-chain multisig reserve.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#fffaf4"/>
  <rect x="34" y="34" width="1132" height="692" rx="22" fill="#ffffff"/>

  <text x="600" y="86" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#121212">Business Reserve Boundary</text>

  <line x1="600" y1="132" x2="600" y2="650" stroke="#b8b8b8" stroke-width="4" stroke-dasharray="12 12"/>
  <text x="315" y="137" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#6a6a6a">personal owner funds</text>
  <text x="885" y="137" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#6a6a6a">business funds</text>

  <g filter="url(#softShadow)">
    <rect x="115" y="175" width="385" height="205" rx="18" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <circle cx="190" cy="250" r="36" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <circle cx="190" cy="235" r="13" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <path d="M164 284 c9 -25 43 -25 52 0" fill="#ffffff" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
  <rect x="258" y="220" width="148" height="94" rx="14" fill="#e7eef2" stroke="#121212" stroke-width="3"/>
  <path d="M258 246 h148" stroke="#121212" stroke-width="3"/>
  <circle cx="378" cy="281" r="13" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <text x="307" y="347" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#121212">Owner A wallet</text>
  <text x="307" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">private Bitcoin outside company reserve</text>

  <g filter="url(#softShadow)">
    <rect x="115" y="445" width="385" height="205" rx="18" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  </g>
  <circle cx="190" cy="520" r="36" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <circle cx="190" cy="505" r="13" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <path d="M164 554 c9 -25 43 -25 52 0" fill="#ffffff" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
  <rect x="258" y="490" width="148" height="94" rx="14" fill="#e7eef2" stroke="#121212" stroke-width="3"/>
  <path d="M258 516 h148" stroke="#121212" stroke-width="3"/>
  <circle cx="378" cy="551" r="13" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <text x="307" y="617" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#121212">Owner B wallet</text>
  <text x="307" y="642" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">private Bitcoin outside company reserve</text>

  <path d="M675 392 H1105" stroke="#121212" stroke-width="4" stroke-linecap="round"/>
  <path d="M675 395 H1105 V660 H675 Z" fill="#fffaf4"/>

  <g filter="url(#softShadow)">
    <path d="M780 225 L892 158 L1004 225 Z" fill="#f39c12" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
    <rect x="805" y="225" width="174" height="105" rx="10" fill="#e7eef2" stroke="#121212" stroke-width="3"/>
  </g>
  <rect x="835" y="270" width="52" height="60" rx="7" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <rect x="916" y="266" width="42" height="38" rx="6" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <line x1="937" y1="266" x2="937" y2="304" stroke="#121212" stroke-width="3"/>
  <path d="M815 236 H969" stroke="#121212" stroke-width="3"/>
  <circle cx="861" cy="309" r="6" fill="#f39c12" stroke="#121212" stroke-width="2"/>
  <rect x="826" y="188" width="132" height="37" rx="8" fill="#121212"/>
  <text x="892" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">STORE</text>
  <text x="892" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#121212">Operating funds</text>
  <text x="892" y="381" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555555">short-term business liquidity</text>

  <g filter="url(#softShadow)">
    <rect x="805" y="450" width="174" height="126" rx="18" fill="#e7eef2" stroke="#121212" stroke-width="4"/>
  </g>
  <circle cx="892" cy="513" r="45" fill="#ffffff" stroke="#121212" stroke-width="5"/>
  <circle cx="892" cy="513" r="27" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <text x="892" y="524" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#121212">₿</text>
  <circle cx="892" cy="467" r="7" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <circle cx="853" cy="538" r="7" fill="#f39c12" stroke="#121212" stroke-width="3"/>
  <circle cx="931" cy="538" r="7" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <rect x="990" y="474" width="66" height="76" rx="12" fill="#ffffff" stroke="#121212" stroke-width="3"/>
  <text x="1023" y="501" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#121212">2-of-3</text>
  <text x="1023" y="522" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#555555">multisig</text>
  <text x="892" y="617" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#121212">Shared on-chain multisig reserve</text>
</svg>
